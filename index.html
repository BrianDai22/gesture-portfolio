<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Brian Dai's interactive gesture-controlled portfolio built with Three.js and MediaPipe">
  <meta name="author" content="Brian Dai">
  <title>Brian Dai | Gesture Portfolio</title>

  <!-- CSS -->
  <link rel="stylesheet" href="styles/main.css">

  <!-- MediaPipe CDN Imports -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <!-- Three.js Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <!-- Main JavaScript Module -->
  <script type="module" src="src/js/main.js"></script>
</head>
<body>
  <main>
    <canvas id="three-canvas"></canvas>
    <video id="camera-feed" class="hidden" playsinline></video>
    <div id="ui-overlay"></div>
  </main>
</body>
</html>
