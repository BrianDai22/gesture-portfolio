# Security headers for static hosting (e.g., AWS S3 + CloudFront)
# Apply these as a CloudFront Response Headers Policy (override mode) on all paths.

Content-Security-Policy: default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-eval' 'wasm-unsafe-eval' 'sha256-WPsFKnr7VBceTXsKETgJ/tQgNmW4ddX5RPzufqWHQxo='; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://cdn.jsdelivr.net; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests
Permissions-Policy: camera=(self), microphone=(), geolocation=()
Referrer-Policy: strict-origin-when-cross-origin
Strict-Transport-Security: max-age=63072000; includeSubDomains; preload
X-Content-Type-Options: nosniff
X-Frame-Options: DENY
